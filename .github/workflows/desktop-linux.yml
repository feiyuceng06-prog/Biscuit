name: Build desktop
on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Validate Windows packaging plus native persistence only (no release)'
        type: boolean
        default: false
  pull_request:
  push:
    branches: ['codex/publish-desktop-*']
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  python:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: python -m pip install ".[openai]" "anthropic==2.8.0"
      - name: Python regression tests
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          timeout --signal=TERM --kill-after=30s 25m python -u -X faulthandler -m unittest discover -v -s tests -t . 2>&1 | tee test-results/python.log
          status=("${PIPESTATUS[@]}")
          printf '%s\n' "${status[0]}" > test-results/python.exit
          printf '%s\n' "${status[1]}" > test-results/log-writer.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          exit "${status[1]}"
      - name: Retain Python regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-regression-${{ matrix.python }}-${{ github.sha }}
          path: test-results/**
          if-no-files-found: warn

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libsecret-1-0 xvfb
      - run: npm ci
        working-directory: desktop
      - run: python tests/source_manifest.py
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python3 scripts/build_backend.py
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: xvfb-run -a npm run test:desktop
        working-directory: desktop
      - run: npm run dist:linux
        working-directory: desktop
      - name: Test packaged application
        working-directory: desktop
        run: FEIYU_TEST_EXECUTABLE="$PWD/release/linux-unpacked/feiyu-desktop" xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feiyu-linux-x64
          path: |
            desktop/release/*.deb
            desktop/release/*.AppImage
            desktop/test-results/**

  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: desktop
      - run: python tests/source_manifest.py
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python scripts/build_windows_shell.py
        working-directory: desktop
      - run: python scripts/build_backend.py
        working-directory: desktop
      - name: Test Git Bash integration
        run: desktop/build/python-build/Scripts/python.exe -m unittest tests.test_windows_support
      - run: npm run build
        working-directory: desktop
      - name: Source GUI at native device scales
        working-directory: desktop
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            $env:FEIYU_TEST_SCALE = $scale
            npm run test:desktop
            if ($LASTEXITCODE -ne 0) { throw "Source GUI failed at scale $scale ($LASTEXITCODE)" }
          }
          Remove-Item Env:FEIYU_TEST_SCALE
      - run: npm run dist:win
        working-directory: desktop
      - name: Test packaged application
        working-directory: desktop
        shell: pwsh
        run: |
          $env:FEIYU_TEST_STAGE = "unpacked"
          $env:FEIYU_TEST_EXECUTABLE = "$PWD/release/win-unpacked/feiyu-desktop.exe"
          npm run test:desktop
      - name: Preserve reviewed LF bytes in legacy comparison checkout
        run: git config --global core.autocrlf false
      - name: Checkout original-name UI for upgrade fixture
        uses: actions/checkout@v4
        with:
          ref: 0105edef8361908284707c47c390b7918864a813
          path: legacy-source
      - name: Build original-name upgrade fixture with identical backend source
        shell: pwsh
        run: |
          python -c "import pathlib,json,hashlib; p=pathlib.Path('legacy-source'); m=json.loads(pathlib.Path('desktop/tests/independent-taskstore-20261120/baseline-sha256.json').read_bytes()); assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==h for n,h in m.items())"
          if ($LASTEXITCODE -ne 0) { throw 'Legacy backend source differs' }
          Push-Location legacy-source/desktop
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Legacy fixture dependencies failed' }
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item ../../desktop/build/backend build/backend -Recurse
          Copy-Item ../../desktop/build/git build/git -Recurse
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw 'Legacy fixture NSIS build failed' }
          Pop-Location
      - name: Install and test the Windows installer
        working-directory: desktop
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'feiyu-install-test'
          $legacyInstaller = (Get-ChildItem ../legacy-source/desktop/release/*.exe | Select-Object -First 1).FullName
          $legacy = Start-Process -FilePath $legacyInstaller -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($legacy.ExitCode -ne 0) { throw "Legacy installer failed: $($legacy.ExitCode)" }
          $compat = Join-Path $env:RUNNER_TEMP 'brand-synthetic-upgrade'
          $legacyExe = Join-Path $installDir 'feiyu-desktop.exe'
          node tests/measure-legacy.mjs $legacyExe
          if ($LASTEXITCODE -ne 0) { throw 'Legacy identity measurement failed' }
          node tests/brand-compat.mjs seed $legacyExe $compat
          if ($LASTEXITCODE -ne 0) { throw 'Legacy synthetic data seed failed' }
          $guid = node -e "const {UUID}=require('builder-util-runtime');console.log(UUID.v5(require('./package.json').build.appId,UUID.parse('50e065bc-3134-11e6-9bab-38c9862bdaf3')))"
          if ($LASTEXITCODE -ne 0) { throw 'Installer GUID derivation failed' }
          $installRoots = @("HKCU:\Software\$guid", "HKLM:\Software\$guid")
          $uninstallRoots = @("HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid", "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid")
          $before = @(Get-ItemProperty $installRoots -ErrorAction SilentlyContinue | Where-Object { $_.InstallLocation -eq $installDir })
          $beforeUninstall = @(Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue)
          @{guid=$guid;install=$before;uninstall=$beforeUninstall;legacyExit=$legacy.ExitCode} | ConvertTo-Json -Depth 5 | Set-Content test-results/brand-before-upgrade.json
          if ($before.Count -ne 1 -or $beforeUninstall.Count -ne 1) { throw 'Legacy installation registry identity missing or duplicated' }
          # Omit /D: the new installer must discover the existing appId-based installation.
          $process = Start-Process -FilePath $installer -ArgumentList @('/S') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $after = @(Get-ItemProperty $installRoots -ErrorAction SilentlyContinue | Where-Object { $_.InstallLocation -eq $installDir })
          $afterUninstall = @(Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue)
          @{guid=$guid;install=$after;uninstall=$afterUninstall;upgradeExit=$process.ExitCode} | ConvertTo-Json -Depth 5 | Set-Content test-results/brand-after-upgrade.json
          $expectedDisplayName = 'Biscuit ' + (Get-Content package.json | ConvertFrom-Json).version
          if ($after.Count -ne 1 -or $after[0].PSPath -ne $before[0].PSPath -or $after[0].ShortcutName -ne 'Biscuit' -or $afterUninstall.Count -ne 1 -or $afterUninstall[0].PSPath -ne $beforeUninstall[0].PSPath -or $afterUninstall[0].DisplayName -ne $expectedDisplayName) { throw 'Upgrade registry identity/display name changed incorrectly' }
          node tests/brand-compat.mjs check $legacyExe $compat
          if ($LASTEXITCODE -ne 0) { throw 'Biscuit upgrade data compatibility failed' }
          $links = @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))
          $shell = New-Object -ComObject WScript.Shell
          $matched = @(Get-ChildItem $links -Filter '*.lnk' -Recurse | Where-Object { $shell.CreateShortcut($_.FullName).TargetPath -eq $legacyExe })
          if (-not ($matched | Where-Object Name -eq 'Biscuit.lnk') -or ($matched | Where-Object Name -eq 'Feiyu.lnk')) { throw 'Upgrade shortcuts incorrect' }
          @{guid=$guid;before=$before;after=$after;beforeUninstall=$beforeUninstall;afterUninstall=$afterUninstall;links=@($matched.FullName);legacyExit=$legacy.ExitCode;upgradeExit=$process.ExitCode} | ConvertTo-Json -Depth 5 | Set-Content test-results/brand-installer-identity.json
          Copy-Item "$compat/*identity.json" test-results/

          $env:FEIYU_TEST_STAGE = 'installed'
          $env:FEIYU_TEST_EXECUTABLE = Join-Path $installDir 'feiyu-desktop.exe'
          if (-not (Test-Path $env:FEIYU_TEST_EXECUTABLE)) { throw "Installed application missing: $env:FEIYU_TEST_EXECUTABLE" }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop test failed' }
          $backend = Join-Path $installDir 'resources/backend/feiyu-backend.exe'
          & ./build/python-build/Scripts/python.exe tests/check_windows_shell.py $backend
          if ($LASTEXITCODE -ne 0) { throw 'Bundled shell test failed' }
      - name: Retain frozen Windows diagnostic payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-windows-diagnostic-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            desktop/build/payload/feiyu-backend/**
            desktop/release/*.exe
            legacy-source/desktop/release/*.exe
            desktop/test-results/**
      - uses: actions/upload-artifact@v4
        with:
          name: feiyu-windows-x64
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/test-results/**

  native-persistence:
    # A separate gate exposes native persistence failures even if packaging fails.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[openai]" "anthropic==2.8.0"
      - name: Native persistence and UTF-8 contracts
        run: python -m unittest -v tests.test_native_persistence tests.test_serve_stdio tests.test_windows_support

  release-state-regressions:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[openai]" "anthropic==2.8.0"
      - name: Verify independent probe transport bytes
        run: python -c "import pathlib,json,hashlib; p=pathlib.Path('desktop/tests/independent-taskstore-20261120'); m=json.loads((p/'transport-sha256.json').read_bytes()); assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==h for n,h in m.items())"
      - name: Current-source native state regressions (ACL must exit 0)
        shell: pwsh
        run: |
          python desktop/tests/release-taskstore-20261120/windows_run.py "$PWD" "$env:RUNNER_TEMP/release-taskstore-scratch"
          $code = $LASTEXITCODE
          Set-Content -Path "$env:RUNNER_TEMP/release-taskstore-exit.txt" -Value $code
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-state-regressions-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-taskstore-scratch/**
            ${{ runner.temp }}/release-taskstore-exit.txt
            desktop/tests/independent-taskstore-20261120/**
            desktop/tests/release-taskstore-20261120/**

  # 打 desktop-v* 标签时把上面那两个包挂到 Releases 上，没有 GitHub 账号也下得到。
  # 单独一个 job：只有它要写权限，装依赖、跑测试那些步骤拿到的 token 照旧是只读的
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/heads/codex/publish-desktop-')
    needs: [python, linux, windows, native-persistence, release-state-regressions]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: feiyu-linux-x64
          path: built
      - uses: actions/download-artifact@v4
        with:
          name: feiyu-windows-x64
          path: built-windows
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            TAG="$REF_NAME"
          else
            TAG="desktop-v$(node -p "require('./desktop/package.json').version")"
          fi
          EXPECTED_TAG="desktop-v$(node -p "require('./desktop/package.json').version")"
          test "$TAG" = "$EXPECTED_TAG"
          {
            (cd built/release && sha256sum *.deb *.AppImage)
            (cd built-windows/release && sha256sum *.exe)
          } > SHA256SUMS
          gh release create "$TAG" built/release/*.deb built/release/*.AppImage built-windows/release/*.exe SHA256SUMS \
            --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Biscuit ${TAG#desktop-v}" \
            --notes-file "desktop/releases/${TAG#desktop-v}.md"
